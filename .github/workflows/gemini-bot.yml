name: Gemini AI GitHub Assistant

on:
  issue_comment:
    types: [created]

jobs:
  gemini-assist:
    if: contains(github.event.comment.body, 'Gemini,') || contains(github.event.comment.body, 'gemini,')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Process with Gemini API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e "
          const fs = require('fs');
          async function run() {
            const prompt = process.env.COMMENT_BODY;
            const apiKey = process.env.GEMINI_API_KEY;
            
            console.log('Processing request with Gemini...');
            
            const response = await fetch(\`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=\${apiKey}\`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{
                  parts: [{ text: \`You are an expert web developer. The user requested: \"\${prompt}\". Read index.html, modify it according to request, and return ONLY the updated full index.html code without markdown ticks.\` }]
                }]
              })
            });
            
            const data = await response.json();
            if (data.candidates && data.candidates[0].content.parts[0].text) {
              let newCode = data.candidates[0].content.parts[0].text.trim();
              if (newCode.startsWith('\`\`\`html')) newCode = newCode.replace(/^\`\`\`html/, '');
              if (newCode.startsWith('\`\`\`')) newCode = newCode.replace(/^\`\`\`/, '');
              if (newCode.endsWith('\`\`\`')) newCode = newCode.slice(0, -3);
              
              fs.writeFileSync('index.html', newCode.trim());
              console.log('Successfully updated index.html');
            }
          }
          run();
          "

      - name: Commit and Push Changes
        run: |
          git config --global user.name "Gemini AI Bot"
          git config --global user.email "gemini-bot@github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update index.html by Gemini AI" && git push)
